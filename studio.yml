name: Build studio

# Regenerates dream-team-studio.html from index.html whenever the game
# changes, so the recording build can never drift out of sync with it.
#
# The generator is pure standard library -- no pip install, no lockfile,
# a run is a few seconds.

on:
  push:
    branches: [main]
    paths:
      # ONLY these. Not dream-team-studio.html itself: this workflow commits
      # that file, and listing it here would make each run trigger the next
      # one forever.
      - "index.html"
      - "make_studio.py"
      - ".github/workflows/studio.yml"
  workflow_dispatch:        # a manual run, for a rebuild with no game change

permissions:
  contents: write           # needed to commit the regenerated file back

concurrency:
  # Two pushes in quick succession would otherwise race to commit the same
  # file and one would fail on a stale ref.
  group: build-studio
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the inputs are actually there
        run: |
          test -f index.html      || { echo "::error::index.html missing"; exit 1; }
          test -f make_studio.py  || { echo "::error::make_studio.py missing -- commit it to the repo root"; exit 1; }
          echo "index.html $(stat -c%s index.html) bytes"

      - name: Generate
        run: python make_studio.py index.html dream-team-studio.html

      - name: Confirm the studio layer is really in there
        # A generator whose anchors stopped matching would emit a file that
        # looks fine and has no toolbar in it -- which nobody discovers until
        # the recording session. Fail the build instead.
        run: |
          for needle in "STUDIO LAYER" "recbar" "getDisplayMedia" "dream-team-studio, generated by"; do
            grep -q "$needle" dream-team-studio.html \
              || { echo "::error::generated file is missing '$needle'"; exit 1; }
          done
          # and that the game itself came through, not just the layer
          grep -q "GR_DATA" dream-team-studio.html \
            || { echo "::error::game payload missing from the output"; exit 1; }
          echo "studio  $(stat -c%s dream-team-studio.html) bytes"

      - name: Confirm index.html was not modified
        # make_studio.py opens the game read-only, but this is the one
        # promise worth verifying on every run rather than trusting.
        run: |
          git diff --quiet -- index.html \
            || { echo "::error::index.html changed -- the generator must never touch it"; exit 1; }

      - name: Commit if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then compare the index. `git diff` reports an
          # untracked file as no change, so checking before staging meant the
          # very first run -- the one that creates the file -- committed
          # nothing, and every run after it looked clean too.
          git add dream-team-studio.html
          if git diff --cached --quiet -- dream-team-studio.html; then
            echo "no change -- nothing to commit"
            exit 0
          fi
          git commit -m "Rebuild dream-team-studio.html from ${GITHUB_SHA:0:7}"
          git push
